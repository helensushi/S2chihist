      { unit: '單元一 宋元', chapter: '第三章 元朝的統治', question: '以下哪國不是蒙古四大汗國之一？', options: ['伊兒汗國', '欽察汗國', '窩闊台汗國', '富察汗國'], correctAnswer: 3, explanation: '四大汗國為察合台、窩闊台、欽察、伊兒汗國。富察是清代滿族姓氏。' },
      { unit: '單元一 宋元', chapter: '第三章 元朝的統治', question: '蒙古第一次西征由誰領導？', options: ['鐵木真', '忽必烈', '拔都', '旭烈兀'], correctAnswer: 0, explanation: '第一次西征由成吉思汗（鐵木真）親自率領，主要攻打花剌子模。' },
      { unit: '單元一 宋元', chapter: '第三章 元朝的統治', question: '元朝為爭取士人支持，推崇哪個派別的學說？', options: ['儒家', '道家', '墨家', '法家'], correctAnswer: 0, explanation: '元朝恢復科舉，並以儒家經典（特別是程朱理學）作為考試內容。' },
      { unit: '單元一 宋元', chapter: '第三章 元朝的統治', question: '以下哪項不是有關元朝統治政策的正確描述？', options: ['南人入仕機會較色目人低', '漢人的活動受到限制', '漢人不能擔任中央官員', '中央職位大多由蒙古人擔任'], correctAnswer: 2, explanation: '漢人仍可擔任官員，但多為副職，實權掌握在蒙古人和色目人手中。' },
      { unit: '單元一 宋元', chapter: '第三章 元朝的統治', question: '以下哪些是對元代色目人的正確描述？\n（1）西夏人包括在內\n（2）社會等級地位比漢人高\n（3）佔元朝人口的一半\n（4）不能參與練兵習武', options: ['（1）（2）', '（3）（4）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 0, explanation: '色目人指西域各族及西夏人，地位僅次於蒙古人，高於漢人與南人。' },
      { unit: '單元一 宋元', chapter: '第三章 元朝的統治', question: '根據元朝法律，若蒙古人殺死漢人或南人，會受哪種刑罰？', options: ['死刑', '滅族', '監禁', '充軍'], correctAnswer: 3, explanation: '元代法律極不平等，蒙古人殺漢人通常只需賠償或充軍，而漢人殺蒙古人則處死。' },
      { unit: '單元一 宋元', chapter: '第三章 元朝的統治', question: '在元朝的統治政策下，部分色目人漸趨漢化，形成哪個民族？', options: ['滿族', '苗族', '回族', '白族'], correctAnswer: 2, explanation: '大量信仰伊斯蘭教的波斯、阿拉伯人（色目人）遷入中國，逐漸融合形成回族。' },

      // 單元二 第一章 明代的君主集權政治
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '以下哪項是有關朱元璋的正確描述？\n（1）出身商人世家\n（2）早年投靠紅巾軍將領郭子興\n（3）年少時曾當過乞丐\n（4）與劉福通號召治河民伕反元', options: ['（1）（2）', '（1）（3）', '（2）（3）', '（3）（4）'], correctAnswer: 2, explanation: '朱元璋出身貧農，曾出家為僧並乞討，後投靠郭子興的紅巾軍。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '元朝末年，白蓮教鼓動民眾反元，號稱甚麼？', options: ['「紅巾軍」', '「黃巾軍」', '「綠林兵」', '「赤眉兵」'], correctAnswer: 0, explanation: '起義軍頭裹紅巾，故稱「紅巾軍」。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '朱元璋早年投靠誰，並屢立戰功？', options: ['韓山童', '張士誠', '郭子興', '陳友諒'], correctAnswer: 2, explanation: '朱元璋投奔濠州紅巾軍首領郭子興，因作戰勇敢受其賞識。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '以下哪個地方是朱元璋反元時的根據地？', options: ['集慶', '潁州', '高郵', '慶元'], correctAnswer: 0, explanation: '朱元璋攻佔集慶（今南京），改名應天府，作為發展勢力的根據地。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '元朝末年，朱元璋以甚麽為口號，派兵攻打大都？', options: ['「清君側，靖內難」', '「創立民國，平均地權」', '「驅逐胡虜，恢復中華」', '「尊周室，攘夷狄」'], correctAnswer: 2, explanation: '朱元璋發布《諭中原檄》，提出「驅逐胡虜，恢復中華」的北伐口號。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '明太祖復行封建制度為明朝帶來甚麼隱患？', options: ['藩王叛亂', '皇權下降', '邊患日深', '地方貧弱'], correctAnswer: 0, explanation: '分封諸子為王掌握軍權，最終導致建文帝時爆發「靖難之變」。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '明太祖藉着哪宗事件，廢除丞相一職？', options: ['紅丸案', '藍玉案', '移宮案', '胡惟庸案'], correctAnswer: 3, explanation: '明太祖以謀反罪誅殺丞相胡惟庸，並永久廢除丞相制度。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '以下哪些是明太祖壓制朝臣的方式？\n（1）朝臣須自稱奴才\n（2）朝臣須跪對奏事\n（3）冒犯君主者會被杖打', options: ['（1）（2）', '（1）（3）', '（2）（3）', '以上皆是'], correctAnswer: 2, explanation: '明代實行「廷杖」制度，且朝臣奏事由坐改為跪，極大貶低了大臣尊嚴。自稱奴才是清代的做法。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '明太祖為監視臣民，以哪個機構為特務組織？', options: ['「皇城司」', '「黏竿處」', '「錦衣衞」', '「內行廠」'], correctAnswer: 2, explanation: '明太祖設立錦衣衞，直接向皇帝負責，負責偵緝、審問臣民。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '明太祖死後，惠帝實行削藩，結果引發哪個事件？', options: ['「奪門之變」', '「靖難之變」', '「甘露之變」', '「土木堡之變」'], correctAnswer: 1, explanation: '燕王朱棣以「清君側」為名起兵反抗削藩，史稱「靖難之變」。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '明朝君務繁重，成祖設立哪個機構協助君主處理政事？', options: ['行中書省', '內閣', '檢察院', '御史台'], correctAnswer: 1, explanation: '廢除丞相後皇帝工作量大增，明成祖正式設立內閣，作為皇帝的顧問機構。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '以下哪些不是明朝「內閣」的職能？\n（1）監察百官施政\n（2）統領中央軍隊\n（3）向君主上奏建議\n（4）參與政務決策', options: ['（1）（2）', '（3）（4）', '（1）（2）（4）', '（2）（3）（4）'], correctAnswer: 0, explanation: '內閣主要是秘書與顧問機構（票擬），無權統軍或直接監察百官。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '明成祖設立哪個由宦官統領的特務組織？', options: ['羽林', '東廠', '察事', '校事府'], correctAnswer: 1, explanation: '明成祖為鎮壓反對勢力，設立由親信宦官提督的「東廠」。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '以下哪項是明朝君主集權所造成的影響？', options: ['君主權力膨脹', '宦官難以干政', '地方積貧積弱', '行政效率提高'], correctAnswer: 0, explanation: '廢丞相、設廠衞等措施使皇權空前強大，但也埋下了宦官專權的隱患。' },
      { unit: '單元二 明', chapter: '第一章 明代的君主集權政治', question: '明朝中葉以後，君主大多昏庸，哪類人得以乘機干政弄權？', options: ['丞相', '内閣', '藩王', '宦官'], correctAnswer: 3, explanation: '皇帝怠政，宦官掌握了「批紅」大權與特務機構，導致宦官專權。' },

      // 單元二 第二章 明代國勢的張弛
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '鄭和下西洋的船隊從哪個地方出發？', options: ['北京', '廣州', '福州', '劉家港'], correctAnswer: 3, explanation: '鄭和船隊主要從江蘇太倉的劉家港出發。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '鄭和下西洋時，曾途經多個國家，其中暹羅是現今的哪個國家？', options: ['越南', '泰國', '柬埔寨', '孟加拉'], correctAnswer: 1, explanation: '暹羅是泰國的古稱。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '鄭和下西洋時，最遠到達哪個地區？', options: ['歐洲東岸', '美洲西岸', '非洲東岸', '亞洲西岸'], correctAnswer: 2, explanation: '鄭和航線橫跨印度洋，最遠到達非洲東岸及紅海沿岸。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '鄭和下西洋途中，哪國國王意圖劫掠船隊，卻被鄭和擊敗？', options: ['真臘', '錫蘭山', '占城', '榜葛剌'], correctAnswer: 1, explanation: '錫蘭山（今斯里蘭卡）國王亞烈苦奈兒圖謀不軌，被鄭和軍隊擊敗並生擒。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '鄭和下西洋後，哪國國王親自訪問明朝晉見成祖？', options: ['占城', '印度', '渤泥國', '阿拉伯'], correctAnswer: 2, explanation: '渤泥國（今汶萊一帶）國王曾親自率團來華訪問。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪些是鄭和下西洋帶來的影響？\n（1）拓展明朝統治範圍\n（2）促進貿易\n（3）促進中外交流\n（4）促進開發南洋', options: ['（1）（3）', '（2）（4）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 3, explanation: '下西洋並未擴張領土，但極大促進了海外貿易、文化交流及華僑開發南洋。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '鄭和船隊在下西洋期間，與各國進行貿易，並換取哪些外國物產？\n（1）茶葉\n（2）瓷器\n（3）香料\n（4）寶石', options: ['（1）（2）', '（1）（3）', '（2）（3）', '（3）（4）'], correctAnswer: 3, explanation: '茶葉和瓷器是中國輸出的商品，換回的主要是香料、寶石及珍禽異獸。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪些是明朝修築長城的原因？\n（1）保衞京師\n（2）鞏固北方邊防\n（3）監視臣民\n（4）文化保育', options: ['（1）（2）', '（3）（4）', '（1）（2）（4）', '（2）（3）（4）'], correctAnswer: 0, explanation: '明朝修築長城主要是為了防禦北方蒙古殘餘勢力（韃靼、瓦剌）的南下。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪個不是曾進犯明朝的邊族？', options: ['瓦剌', '韃靼', '契丹', '女真'], correctAnswer: 2, explanation: '契丹是宋代時期的外患（遼朝），明代的主要邊患是蒙古（瓦剌、韃靼）與後期的女真。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪些是明朝長城的特點？\n（1）沿線設有多個關口\n（2）全長超過一萬里\n（3）在明中葉完成修築\n（4）牆身以磚石包砌', options: ['（1）（2）', '（1）（4）', '（2）（3）', '（3）（4）'], correctAnswer: 1, explanation: '明長城東起鴨綠江，西至嘉峪關，多以堅固的磚石包砌，並設有重重關隘。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '明朝後期，哪位將領在薊州的長城上增築了空心敵台？', options: ['于謙', '袁崇煥', '戚繼光', '李定國'], correctAnswer: 2, explanation: '抗倭名將戚繼光調任薊鎮後，大修長城並首創空心敵台，加強防禦火力。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '明朝的將士在長城上會利用甚麼來傳遞警報？', options: ['箭書', '烽火', '飛鴿', '旗語'], correctAnswer: 1, explanation: '長城沿線設有烽火台，遇敵情時日夜燃放煙火傳遞軍情。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪個不是明朝「九邊」重鎮之一？', options: ['遼東', '荊州', '寧夏', '延綏'], correctAnswer: 1, explanation: '荊州位於南方長江流域，而「九邊」是明朝在北方長城沿線設立的九個軍事重鎮。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪些是明成祖遷都北京的原因？\n（1）應天因政變殘破不堪\n（2）經前代營建該地區已具備國都規模\n（3）易於指揮北方邊防\n（4）該地區乃成祖發跡之地', options: ['（1）（2）', '（2）（4）', '（1）（2）（4）', '（2）（3）（4）'], correctAnswer: 3, explanation: '北京是成祖做燕王時的封地，且地理位置有利於防禦蒙古，元代時也已具備都城規模。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '皇帝的居所在北京城的哪個地方？', options: ['宮城', '皇城', '內城', '外城'], correctAnswer: 0, explanation: '皇帝居住在最核心的宮城，即紫禁城。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '紫禁城在北京城的哪個位置？', options: ['中央', '城南', '城北', '城西'], correctAnswer: 0, explanation: '紫禁城位於北京城的中軸線中央，象徵皇權至高無上。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪項不是北京城的特點？', options: ['由四個城區組成', '內城四周有護城河圍繞', '設五座城門', '權力核心在宮城'], correctAnswer: 2, explanation: '北京內城設有九座城門（「內九外七皇城四」），並非五座。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '紫禁城是指北京城的哪個部分？', options: ['宮城', '皇城', '內城', '外城'], correctAnswer: 0, explanation: '紫禁城即是宮城，是明清兩代皇帝的宮殿。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '中軸線使北京城形成怎樣的格局？', options: ['南北對稱', '前後對稱', '左右對稱', '上下對稱'], correctAnswer: 2, explanation: '北京城以中軸線為基準，主要建築左右（東西）對稱排列。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '明朝重用宦官的風氣是從哪個皇帝開始的？', options: ['明太祖', '明成祖', '明仁宗', '明宣宗'], correctAnswer: 1, explanation: '明成祖因奪位時得宦官之助，開始重用宦官並設立東廠。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪些是導致明朝宦官干政出現的主要原因？\n（1）外戚得勢\n（2）明中葉皇帝大多不理政事\n（3）宦官掌管東廠', options: ['（1）（2）', '（1）（3）', '（2）（3）', '以上皆是'], correctAnswer: 2, explanation: '明代防範外戚極嚴，宦官干政主因是皇帝怠政及宦官掌握特務與批紅權。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '以下哪個是明熹宗時期弄權的宦官？', options: ['王振', '汪直', '劉謹', '魏忠賢'], correctAnswer: 3, explanation: '明熹宗時，宦官魏忠賢專權，自稱「九千歲」，殘害東林黨人。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '努爾哈赤統一女真各部，並在哪一年建立後金？', options: ['1616年', '1626年', '1636年', '1644年'], correctAnswer: 0, explanation: '1616年，努爾哈赤建立大金政權，史稱後金。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '哪位女真族領袖把族名改稱為滿洲？', options: ['努爾哈赤', '皇太極', '玄燁', '福臨'], correctAnswer: 1, explanation: '皇太極繼位後，改族名為滿洲，並於1636年改國號為清。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '努爾哈赤在哪裏被明軍擊敗，並在不久死去？', options: ['薩爾滸', '寧遠', '瀋陽', '遼陽'], correctAnswer: 1, explanation: '在寧遠之戰中，明將袁崇煥用紅夷大炮擊退後金軍，努爾哈赤受傷後不久病死。' },
      { unit: '單元二 明', chapter: '第二章 明代國勢的張弛', question: '明朝末年，哪個守將向清投降，並引清兵入關？', options: ['祖大壽', '洪承疇', '吳三桂', '左良玉'], correctAnswer: 2, explanation: '李自成攻陷北京後，駐守山海關的明將吳三桂引清兵入關，擊敗農民軍。' },

      // 單元三 第一章 清朝與統一多民族國家的鞏固與發展
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪人不是清初被朝廷封為藩王的明朝降將？', options: ['吳三桂', '尚可喜', '耿仲明', '熊廷弼'], correctAnswer: 3, explanation: '熊廷弼是明末抗清名將，並未投降。清初三藩為吳三桂、尚可喜、耿仲明。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '清初，藩王勢力坐大，朝廷下令削藩，引發了甚麼事件？', options: ['「三監之亂」', '「六鎮之亂」', '「三藩之亂」', '「八王之亂」'], correctAnswer: 2, explanation: '康熙帝下令削藩，吳三桂等人起兵反叛，史稱「三藩之亂」。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '1683年，康熙帝派兵攻打台灣，以下哪人向清朝投降？', options: ['鄭經', '鄭克塽', '鄭芝龍', '鄭成功'], correctAnswer: 1, explanation: '清將施琅攻克澎湖後，鄭成功之孫鄭克塽見大勢去，出降清廷。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '1661年，清廷頒布甚麼命令，使東南沿海居民向內陸遷徙？', options: ['遷界令', '移民令', '租界令', '遷租令'], correctAnswer: 0, explanation: '為切斷沿海居民對鄭成功抗清勢力的接濟，清廷下令實施「遷界令」。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '康熙帝時，誰和廣東巡撫王來任請求廢除遷界令？', options: ['周有德', '林則徐', '葉名琛', '劉坤一'], correctAnswer: 0, explanation: '兩廣總督周有德與廣東巡撫王來任上疏陳述遷界之苦，促使朝廷復界。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪項是「客家人」得名的由來？', options: ['祖先曾協助官府平定叛亂，獲封「客家軍」', '地方官府將南遷移民歸類為「客籍」', '祖先擔任「客使」之職，負責接待外來者', '祖先來自客家窩'], correctAnswer: 1, explanation: '復界後，清廷鼓勵內陸居民遷入沿海，官府將這些新移民編為「客籍」。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '錦田鄧氏族人修建了哪間書院，以紀念兩位官員爭取廢除遷界令的功德？', options: ['覲廷書室', '力瀛書院', '二帝書院', '周王二公書院'], correctAnswer: 3, explanation: '為感念周有德與王來任的恩德，錦田鄉民建「周王二公書院」祭祀。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪條是香港現存的客家圍村？', options: ['灣仔 藍屋', '柴灣 羅屋', '荃灣 三棟屋', '長沙灣 李鄭屋'], correctAnswer: 2, explanation: '荃灣三棟屋是香港著名的客家圍村，現已活化為博物館。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '「三藩之亂」發生在以下哪一段時期？', options: ['清兵入關後隨即發生', '南明滅亡後才發生', '清朝收復台灣後才發生', '在宣布遷界令的同年發生'], correctAnswer: 1, explanation: '三藩之亂發生在康熙年間，當時南明政權已被消滅，清廷開始著手削藩。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '清廷於何年統一全國？', options: ['1644年', '1662年', '1681年', '1683年'], correctAnswer: 3, explanation: '1683年清軍攻克台灣，標誌著清廷基本完成了對全國的統一。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '清朝哪三位皇帝在位期間，國力達到鼎盛？', options: ['順治帝、康熙帝、雍正帝', '康熙帝、雍正帝、乾隆帝', '雍正帝、乾隆帝、嘉慶帝', '乾隆帝、嘉慶帝、道光帝'], correctAnswer: 1, explanation: '康熙、雍正、乾隆三朝是清代國力最鼎盛的時期，史稱「康雍乾盛世」。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪些不是清朝初年被納入清代疆域範圍的地區？\n（1）越南\n（2）朝鮮\n（3）台灣\n（4）西藏', options: ['（1）（2）', '（1）（3）', '（2）（3）', '（2）（4）'], correctAnswer: 0, explanation: '越南與朝鮮是清朝的藩屬國，並非直接統治的疆域版圖。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪些是清廷對漢人實施的懷柔政策？\n（1）開科取士\n（2）優待明降臣\n（3）推崇道學\n（4）廢除明末苛税', options: ['（1）', '（1）（3）', '（1）（2）（4）', '（2）（3）（4）'], correctAnswer: 2, explanation: '清初為安撫漢人，廢除三餉苛稅，尊崇儒學（非道學），並開科舉錄用漢人。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪項不是清廷對漢人實施懷柔政策的原因？', options: ['減低漢人反清情緒', '穩定清初局勢', '避免滿人被漢化', '滿洲人口不及漢族'], correctAnswer: 2, explanation: '懷柔政策是為了鞏固統治、安撫佔多數的漢人，而非為了避免滿人漢化。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪些是清廷對漢人實施的高壓政策？\n（1）迫令漢人薙髮留辮\n（2）禁止漢人習武\n（3）大興文字獄\n（4）禁止漢族士人結社集會', options: ['（2）', '（1）（3）', '（1）（2）（3）', '（1）（3）（4）'], correctAnswer: 3, explanation: '清廷實施剃髮易服、文字獄及嚴禁士人結社，以高壓手段摧毀漢人的反抗意識。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪些是清廷對蒙古族的管治措施？\n（1）向蒙古族封官授爵\n（2）滿蒙皇族通婚\n（3）禁止藏傳佛教傳播\n（4）鼓勵漢蒙兩族交往', options: ['（1）（2）', '（1）（4）', '（2）（3）', '（3）（4）'], correctAnswer: 0, explanation: '清廷實行「滿蒙聯姻」及封爵，並尊崇藏傳佛教以安撫蒙古，同時嚴禁漢蒙交往。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪項是清廷對藏族統治政策的主要特點？', options: ['推廣文教', '開發當地經濟', '徵收重稅', '派駐官員總理藏政'], correctAnswer: 3, explanation: '清廷設立「駐藏大臣」，代表中央政府與達賴、班禪共同管理西藏事務。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪些是清廷對藏族的管治措施？\n（1）鼓勵藏人出家\n（2）強迫藏人學習漢字\n（3）冊封其宗教領袖\n（4）設置伊犁將軍', options: ['（1）（3）', '（1）（4）', '（2）（4）', '（3）（4）'], correctAnswer: 0, explanation: '清帝冊封達賴與班禪，並尊崇黃教，藉此維繫對西藏的統治。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪些是清廷對新疆回民的管治措施？\n（1）加強對新疆各部的管理\n（2）禁止回民和漢人往來\n（3）禁止伊斯蘭教傳播\n（4）禁止宗教領袖干政', options: ['（1）（3）', '（2）（4）', '（1）（2）（4）', '（2）（3）（4）'], correctAnswer: 0, explanation: '清廷平定回部後，設伊犁將軍管轄，並實行隔離政策禁止漢回交往。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '清廷設立哪個職位管理新疆回民事務？', options: ['大喇嘛', '大國師', '伊犁將軍', '駐回大臣'], correctAnswer: 2, explanation: '乾隆帝平定準噶爾與回部後，設立伊犁將軍，統轄整個新疆地區。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪項不是清廷對西南邊族的管治措施？', options: ['派流官管治西南地區', '廢除土司制度', '將西南地區納入地方行政系統', '強迫族人學習滿文'], correctAnswer: 3, explanation: '清廷在西南實行「改土歸流」，廢除世襲土司改派流官，但並未強迫學習滿文。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '乾隆帝晚年寵信哪位大臣，導致朝政敗壞？', options: ['傅恒', '和珅', '張廷玉', '紀曉嵐'], correctAnswer: 1, explanation: '和珅深得乾隆寵信，結黨營私，大肆貪污，導致清朝吏治極度腐敗。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '和珅貪污舞弊，敗壞吏治，最後被哪位皇帝逮捕抄家？', options: ['嘉慶帝', '道光帝', '咸豐帝', '同治帝'], correctAnswer: 0, explanation: '乾隆帝死後，嘉慶帝隨即將和珅革職下獄並賜死，抄出巨額家產。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪項不是導致清代中衰的主因？', options: ['太監弄權', '土地兼併', '吏治敗壞', '民變四起'], correctAnswer: 0, explanation: '清代對宦官防範極嚴，並未出現如明代般的太監弄權現象。' },
      { unit: '單元三 清', chapter: '第一章 清朝與統一多民族國家的鞏固與發展', question: '以下哪些是乾隆至嘉慶年間爆發的民變事件？\n（1）天理教起事\n（2）清水教起事\n（3）紅巾軍起事\n（4）太平天國起事', options: ['（1）（2）', '（3）（4）', '（1）（2）（3）', '（2）（3）（4）'], correctAnswer: 0, explanation: '乾嘉時期爆發了白蓮教及其支派（如天理教）的起事。太平天國是咸豐年間的事。' },

      // 單元三 第二章 外力衝擊與內憂
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是十八世紀中期（清中葉）歐洲各國向東擴張的原因？\n（1）尋找原料供應地\n（2）開拓商品銷售市場\n（3）學習東方文化藝術', options: ['（1）（2）', '（1）（3）', '（2）（3）', '（1）（2）（3）'], correctAnswer: 0, explanation: '工業革命後，歐洲列強急需海外市場傾銷商品及掠奪工業原料。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '在十八世紀中期，歐洲發生甚麼事件，導致各國生產力大增？', options: ['文藝復興', '工業革命', '宗教改革', '十字軍東征'], correctAnswer: 1, explanation: '工業革命以機器取代手工，極大地提高了歐洲的生產力。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是有關清朝前期歐美商人在華貿易的正確描述？\n（1）多在沿海港口貿易\n（2）只能在指定口岸貿易\n（3）可申請進入內地貿易\n（4）外商必須經「公行」進行買賣', options: ['（1）（2）', '（2）（4）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 1, explanation: '清廷實行閉關政策，外商只能在廣州一口通商，且必須透過「公行」進行交易。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '清朝的公行又稱甚麼？', options: ['十三行', '交易行', '貿易行', '外貿行'], correctAnswer: 0, explanation: '廣州的特許洋行被稱為「廣州十三行」，壟斷了對外貿易。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '清代「十三行」是甚麼組織？', options: ['專營對外貿易的商行', '救濟貧苦的慈善團體', '維持地方治安的隊伍', '調整民間糾紛的組織'], correctAnswer: 0, explanation: '十三行是清政府特許專營對外貿易的商行，負責代理外商買賣及管束外商。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '清朝乾隆年間，英國曾派哪位使者赴華，尋求改善通商條件？', options: ['馬甘尼', '阿美士德', '律勞卑', '查理義律'], correctAnswer: 0, explanation: '1793年，英國派馬甘尼（Macartney）使團訪華，但遭乾隆帝拒絕其通商要求。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '乾隆年間，朝廷只准歐美商人在哪個口岸通商？', options: ['廣州', '漳州', '泉州', '杭州'], correctAnswer: 0, explanation: '乾隆帝下令關閉其他海關，僅保留廣州作為唯一通商口岸。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '乾隆年間，清廷規定外商必須經過哪個機構進行貿易？', options: ['海關', '公行', '使館', '市舶司'], correctAnswer: 1, explanation: '外商不得直接與中國官民接觸，必須透過「公行」（十三行）進行貿易。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '清初以來，英國對華貿易出現嚴重逆差，外商遂向中國走私哪種貨品以改變此局面？', options: ['烈酒', '鴉片', '槍械', '棉織品'], correctAnswer: 1, explanation: '為扭轉購買中國茶葉、絲綢造成的貿易逆差，英國東印度公司大量走私鴉片入華。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '道光年間，誰被封為欽差大臣，到廣州主持禁煙？', options: ['李鴻章', '曾國藩', '左宗棠', '林則徐'], correctAnswer: 3, explanation: '道光帝任命林則徐為欽差大臣赴廣州查禁鴉片，引發了著名的「虎門銷煙」。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪宗事件是第一次鴉片戰爭爆發的導火線？', options: ['林維喜案', '西林教案', '天津教案', '亞羅號事件'], correctAnswer: 0, explanation: '英國水兵在九龍尖沙咀打死村民林維喜，英方拒絕交出兇手，成為戰爭導火線。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是中英《南京條約》的內容？\n（1）割香港島予英國\n（2）允許英國在北京設領事館\n（3）開放十個通商口岸\n（4）清廷向英國賠償2100萬銀元', options: ['（1）（2）', '（1）（4）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 1, explanation: '《南京條約》規定割讓香港島、賠款2100萬銀元，並開放廣州、福州、廈門、寧波、上海五口通商。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '1843年，中英兩國簽署《虎門條約》，英國獲得哪項特權？', options: ['京師駐軍權', '領事裁判權', '內河航行權', '自由傳教權'], correctAnswer: 1, explanation: '《虎門條約》作為補充條約，使英國獲得了領事裁判權（治外法權）及片面最惠國待遇。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪幾項不是第一次鴉片戰爭為中國帶來的影響？\n（1）國家主權喪失\n（2）國際地位上升\n（3）經濟大受打擊\n（4）民族士氣高昂', options: ['（1）（2）', '（1）（4）', '（2）（3）', '（2）（4）'], correctAnswer: 3, explanation: '戰敗導致中國主權受損、國際地位下降，且民族自信心受到嚴重打擊。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪項不是導致第二次鴉片戰爭爆發的主因？', options: ['西林教案', '義和團排外', '亞羅號事件', '廣州入城問題'], correctAnswer: 1, explanation: '義和團運動發生在1900年，是八國聯軍之役的背景。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '1858年，英法聯軍攻陷大沽炮台，清廷被迫簽訂哪項條約？', options: ['《天津條約》', '《北京條約》', '《南京條約》', '《璦琿條約》'], correctAnswer: 0, explanation: '英法聯軍逼近天津，清廷被迫簽訂《天津條約》。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是清廷與英、法簽訂的《天津條約》及其補充條約《通商章程善後條約》的內容？\n（1）允許鴉片合法進口\n（2）允許外國公使進駐北京\n（3）允許英法船艦在長江內河航行\n（4）增開十五個通商口岸', options: ['（1）（2）', '（3）（4）', '（1）（2）（3）', '（2）（3）（4）'], correctAnswer: 2, explanation: '條約規定增開十個（非十五個）通商口岸，並允許公使駐京、內河航行及鴉片合法化（稱洋藥）。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '1860年，英法聯軍攻佔北京，並在同年與清廷簽訂哪項條約？', options: ['《天津條約》', '《北京條約》', '《南京條約》', '《璦琿條約》'], correctAnswer: 1, explanation: '英法聯軍火燒圓明園後，迫使清廷簽訂了《北京條約》。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是清廷與英、法簽訂的《北京條約》內容？\n（1）賠償英法各四百萬銀兩\n（2）允許招募華工出國\n（3）增設天津為通商口岸\n（4）割九龍半島北部予英國', options: ['（1）（2）', '（2）（3）', '（1）（2）（4）', '（2）（3）（4）'], correctAnswer: 1, explanation: '《北京條約》增開天津，准許華工出國，並割讓九龍半島南部（界限街以南）給英國。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪項不是第二次鴉片戰爭為中國帶來的影響？', options: ['國家主權淪喪', '喪失大片領土', '教案日漸頻繁', '喪失民族自信'], correctAnswer: 3, explanation: '雖然主權受損，但戰敗也刺激了部分官員覺醒，促成了後來的「洋務運動」。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪項不是太平天國運動爆發的主因？', options: ['民眾生計受損', '朝廷吏治敗壞', '清朝軍隊士氣低落', '漢人不滿高壓政策'], correctAnswer: 2, explanation: '軍隊士氣低落是清朝難以迅速平亂的原因，而非農民起義的爆發主因。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '咸豐年間，誰創立太平天國，率眾起事？', options: ['洪秀全', '石達開', '韋昌輝', '楊秀清'], correctAnswer: 0, explanation: '洪秀全在廣西金田村發動起義，建立太平天國。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '道光年間，洪秀全利用基督教教義，創辦哪個組織？', options: ['白蓮教會', '基督教會', '天理教會', '拜上帝會'], correctAnswer: 3, explanation: '洪秀全揉合了基督教教義與中國民間信仰，創立了「拜上帝會」。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '清廷哪兩位大臣借助外國人訓練指揮的洋槍隊進攻太平天國？', options: ['胡林翼、彭玉麟', '左宗棠、張之洞', '李鴻章、曾國藩', '劉銘傳、沈葆楨'], correctAnswer: 2, explanation: '曾國藩的湘軍與李鴻章的淮軍（配合洋槍隊）是鎮壓太平天國的主力。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '部分官員在對付太平天國期間，目睹西方軍備的先進，於是推動哪場改革運動？', options: ['洋務運動', '明治維新', '戊戌維新', '清末新政'], correctAnswer: 0, explanation: '曾國藩、李鴻章等人在平亂中認識到西方堅船利炮的威力，發起了「洋務運動」。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是太平天國運動為清廷帶來的影響？\n（1）清廷國力受損\n（2）消除反清意識\n（3）促成戊戌維新\n（4）漢人勢力增強', options: ['（1）（2）', '（1）（4）', '（2）（3）', '（3）（4）'], correctAnswer: 1, explanation: '戰爭嚴重消耗了清朝國力，同時因依賴湘淮軍，使漢族官僚勢力大幅崛起。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '日本推行哪場改革後國力上升，並選擇仿效西方列強的殖民擴張？', options: ['洋務運動', '明治維新', '大化改新', '維新運動'], correctAnswer: 1, explanation: '日本透過「明治維新」迅速西化並富國強兵，隨即走上對外擴張之路。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '自明治維新起，日本積極對外擴張，並於1879年吞併清朝哪個藩屬？', options: ['琉球', '越南', '朝鮮', '緬甸'], correctAnswer: 0, explanation: '日本於1879年正式吞併琉球王國，改設為沖繩縣。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪個不是日本於甲午戰爭前企圖侵略朝鮮的舉動？', options: ['簽約迫使朝鮮宣稱為獨立國', '與清朝簽約，使朝鮮成為中日共同保護國', '暗中支持東學黨發動起事', '派軍艦駛進江華島'], correctAnswer: 1, explanation: '日本迫使朝鮮簽訂《江華條約》，否定清朝的宗主權，並未與清朝共管。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '1894年，中日雙方因朝鮮發生甚麼事件，並同時出兵介入？', options: ['牛李黨爭', '東林黨爭', '新舊黨爭', '東學黨之亂'], correctAnswer: 3, explanation: '朝鮮爆發「東學黨之亂」，清廷應邀出兵平亂，日本亦藉機大舉派兵，引發甲午戰爭。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪個地方不是中日甲午戰爭中的主要戰場？', options: ['天津', '平壤', '大連', '牙山'], correctAnswer: 0, explanation: '甲午戰爭主要在朝鮮半島（牙山、平壤）、黃海及遼東半島（大連、旅順）進行。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '1895年，清廷於甲午戰爭中戰敗，並與日本簽訂哪項條約？', options: ['《南京條約》', '《天津條約》', '《馬關條約》', '《辛丑條約》'], correctAnswer: 2, explanation: '李鴻章代表清廷赴日本馬關，簽訂了喪權辱國的《馬關條約》。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是中日《馬關條約》的內容？\n（1）中國承認朝鮮獨立自主\n（2）須聘用日本人為政治顧問\n（3）日本可在中國通商口岸設工廠\n（4）割遼東半島、台灣及澎湖列島予日本', options: ['（1）（2）', '（2）（4）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 2, explanation: '條約允許日本在華設廠，並割讓台灣、澎湖及遼東半島，承認朝鮮獨立。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '俄國要求日本交還遼東半島給中國，日本被迫同意，但提出甚麼要求？', options: ['清廷給予日本免稅優惠', '清廷開放額外五個通商口岸', '清廷須割杭州給日本', '清廷須向日本繳付「贖遼費」'], correctAnswer: 3, explanation: '在俄、德、法「三國干涉還遼」下，日本交還遼東半島，但勒索了3000萬兩白銀的「贖遼費」。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '中日簽署《馬關條約》後，激發有識之士覺醒，促成哪場改革運動？', options: ['洋務運動', '戊戌維新', '明治維新', '清末新政'], correctAnswer: 1, explanation: '甲午戰敗證明洋務運動失敗，康有為等人發起「公車上書」，推動了「戊戌維新」。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪個不是中日《馬關條約》規定開放的通商口岸？', options: ['沙市', '重慶', '瓊州', '杭州'], correctAnswer: 2, explanation: '《馬關條約》增開沙市、重慶、蘇州、杭州為通商口岸。瓊州是《天津條約》開放的。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪項不是《馬關條約》對中國的影響？', options: ['鴉片販賣合法化', '國際地位下降', '領土主權受損', '陷入被瓜分危機'], correctAnswer: 0, explanation: '鴉片合法化是在第二次鴉片戰爭後的《通商章程善後條約》中規定的。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '清廷於甲午戰爭中戰敗後，山東被哪個國家劃分為其勢力範圍？', options: ['俄國', '英國', '德國', '法國'], correctAnswer: 2, explanation: '德國以巨野教案為藉口佔領膠州灣，將山東劃為其勢力範圍。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是八國聯軍之役爆發的背景？\n（1）洋貨傾銷，民生日困\n（2）軍隊士氣低落\n（3）國内教案衝突頻生\n（4）國内排外情緒高漲', options: ['（1）（2）', '（2）（3）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 2, explanation: '列強瓜分中國及傳教士橫行，激起民間強烈的排外情緒，最終爆發義和團運動。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '1899年，慈禧太后發動哪一場政變，囚禁光緒帝，中止變法？', options: ['戊戌政變', '玄武門之變', '甘露之變', '靖難之變'], correctAnswer: 0, explanation: '慈禧太后發動「戊戌政變」，囚禁光緒帝並捕殺維新派，百日維新宣告失敗。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪個國家沒有參與八國聯軍之役？', options: ['俄國', '奧地利', '葡萄牙', '意大利'], correctAnswer: 2, explanation: '八國聯軍包括英、美、法、德、俄、日、意、奧。葡萄牙並未參與。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪項是引致八國聯軍之役的導火線？', options: ['馬賴神父被清官員處死', '義和團在各處進行排外活動', '林維喜被英軍士兵打死', '中英爆發廣州入城問題'], correctAnswer: 1, explanation: '義和團打出「扶清滅洋」旗號，破壞鐵路、攻擊教堂及使館，引發列強聯合出兵。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '1900年，八國聯軍攻陷北京後，慈禧太后與光緒帝逃至哪裏？', options: ['山東', '上海', '天津', '西安'], correctAnswer: 3, explanation: '聯軍攻陷北京，慈禧太后挾持光緒帝倉皇西逃至西安。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪些是《辛丑條約》的內容？\n（1）各國在北京設立使館區\n（2）清廷增開十個通商口岸\n（3）清廷須拆除大沽口炮台\n（4）各國在廣州沿線駐兵', options: ['（1）（3）', '（2）（3）', '（1）（2）（3）', '（2）（3）（4）'], correctAnswer: 0, explanation: '條約規定劃定北京東交民巷為使館區，並拆除大沽至北京沿線炮台，允許列強駐軍。' },
      { unit: '單元三 清', chapter: '第二章 外力衝擊與內憂', question: '以下哪項不是《辛丑條約》為清廷帶來的影響？', options: ['管治威信盡失', '各省宣告獨立', '經濟疲弱枯竭', '中國國防大開'], correctAnswer: 1, explanation: '各省宣告獨立是在1911年武昌起義（辛亥革命）之後發生的。' },

      // 單元三 第三章 清廷的圖強
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪人不是洋務運動的主要領導人？', options: ['左宗棠', '張之洞', '康有為', '曾國藩'], correctAnswer: 2, explanation: '康有為是後來「戊戌維新」的領導人。洋務派代表為曾國藩、李鴻章、左宗棠等。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項是洋務運動的前期目標？', options: ['「富國」', '「富民」', '「強兵」', '「廉政」'], correctAnswer: 2, explanation: '洋務運動前期以「自強」（強兵）為口號，後期才轉向「求富」（富國）。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪個是洋務運動時專門培育翻譯及外交人才的機構？', options: ['同文館', '軍機處', '船政學堂', '總理衙門'], correctAnswer: 0, explanation: '京師同文館是洋務運動期間設立的第一所新式學堂，專門培養外語及外交人才。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪些是洋務運動的軍事措施？\n（1）用西法練軍隊\n（2）興辦軍事工業\n（3）購入西方軍備\n（4）修築邊境長城', options: ['（1）（2）', '（1）（3）', '（1）（2）（3）', '（2）（3）（4）'], correctAnswer: 2, explanation: '洋務派創辦兵工廠、購買西方船炮並建立新式海陸軍，但未修築長城。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪支海軍艦隊是在洋務運動期間創建的？', options: ['北海艦隊', '吉野艦隊', '南海艦隊', '北洋艦隊'], correctAnswer: 3, explanation: '李鴻章籌建了北洋艦隊，是當時亞洲最具規模的近代化海軍。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪些是導致洋務運動失敗的原因？\n（1）朝中守舊勢力阻撓\n（2）戰爭毀壞基建設施\n（3）官員從中貪污舞弊\n（4）慈禧太后發動政變', options: ['（1）（3）', '（2）（3）', '（2）（4）', '（3）（4）'], correctAnswer: 0, explanation: '洋務運動受頑固派阻撓，且缺乏制度改革，官辦企業貪污腐敗嚴重。慈禧政變是針對戊戌維新。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪些是洋務運動帶來的影響？\n（1）創建近代工業\n（2）奠定軍事現代化基礎\n（3）導致清廷仇外\n（4）培育西學人才', options: ['（1）（2）', '（3）（4）', '（1）（2）（4）', '（2）（3）（4）'], correctAnswer: 2, explanation: '洋務運動引進了西方科技，開啟了中國近代工業化與軍事現代化的步伐。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '戊戌維新是受到哪場戰爭失敗的刺激而推行？', options: ['鴉片戰爭', '英法聯軍之役', '甲午戰爭', '八國聯軍之役'], correctAnswer: 2, explanation: '甲午戰爭的慘敗宣告洋務運動破產，促使知識份子尋求更深層次的制度變革。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪人不是清末維新派人士？', options: ['康有為', '孫中山', '梁啟超', '譚嗣同'], correctAnswer: 1, explanation: '孫中山是革命派的領袖，主張推翻清朝；康、梁、譚則是主張君主立憲的維新派。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項不是戊戌維新主要的政治改革措施？', options: ['澄清吏治', '廣開言路', '裁撤冗官', '減省約法'], correctAnswer: 3, explanation: '維新派允許官民上書言事（廣開言路）並裁撤閒散衙門，但並未「減省約法」。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項不是戊戌維新主要的教育改革措施？', options: ['廢除八股文', '設立京師大學堂', '廢除科舉制度', '興辦報館及譯書局'], correctAnswer: 2, explanation: '戊戌維新僅廢除八股文改考策論，真正「廢除科舉制度」是在後來的清末新政（1905年）。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '京師大學堂是哪間大學的前身？', options: ['浙江大學', '復旦大學', '清華大學', '北京大學'], correctAnswer: 3, explanation: '戊戌維新期間創立的京師大學堂，是中國近代第一所國立綜合性大學，即北京大學前身。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪些是導致戊戌維新失敗的原因？\n（1）維新派勢力過大\n（2）變法過急和混亂\n（3）部分官員反對新政\n（4）慈禧太后發動政變', options: ['（1）（2）（3）', '（1）（2）（4）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 3, explanation: '維新派缺乏實權且操之過急，觸動了以慈禧太后為首的守舊派利益，最終遭政變鎮壓。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪些是戊戌維新對中國的影響？\n（1）刺激民眾排外\n（2）知識分子減少\n（3）啟發清末新政\n（4）傳播立憲思想', options: ['（1）（2）', '（3）（4）', '（1）（3）（4）', '（2）（3）（4）'], correctAnswer: 1, explanation: '維新運動雖然失敗，但廣泛傳播了西方民主立憲思想，並為後來的清末新政奠定基礎。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '清廷與列強簽署《辛丑條約》後，促使其推行哪場改革運動？', options: ['洋務運動', '明治維新', '維新運動', '清末新政'], correctAnswer: 3, explanation: '經歷八國聯軍之役的重創後，清廷為挽救統治危機，被迫推動「清末新政」。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項不是清末新政的目標？', options: ['消弭排外意識', '挽回國内民心', '壓抑地方勢力', '抗衡國内革命活動'], correctAnswer: 0, explanation: '新政的主要目的是為了挽回民心、抵制日益高漲的革命運動以延續清朝統治。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項不是清末新政的經濟措施？', options: ['開辦現代銀行', '嚴格規管外商買賣', '修建鐵路', '確立經濟制度和法律'], correctAnswer: 1, explanation: '新政設立商部，頒布商法，鼓勵私人資本辦實業，並未嚴格規管外商。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項不是清末新政的軍事措施？', options: ['重建八旗兵', '裁撤綠營兵', '成立練兵處', '派軍官出洋學習'], correctAnswer: 0, explanation: '新政裁撤了老舊的八旗與綠營，成立練兵處，全面編練新軍。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項不是清末新政的教育措施？', options: ['廢除科舉制', '設立新式學堂', '派遣留學生出國', '設立京師大學堂'], correctAnswer: 3, explanation: '設立京師大學堂是戊戌維新的措施；清末新政則正式廢除了科舉制度。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '以下哪項是導致清末新政失敗的原因？', options: ['列強宣戰入侵', '改革資金被挪用', '清廷立憲誠意不足', '慈禧太后發動政變'], correctAnswer: 2, explanation: '清廷推出「皇族內閣」，暴露了其假立憲的真面目，令立憲派徹底絕望。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '清末新政如何加速清朝滅亡？', options: ['暴露清廷無意立憲，引發民怨', '推行立憲進度過於急速', '列強乘機干涉清廷內政', '引發地方割據混戰'], correctAnswer: 0, explanation: '假立憲使原本支持清廷的溫和立憲派倒向革命陣營，加速了清朝的覆滅。' },
      { unit: '單元三 清', chapter: '第三章 清廷的圖強', question: '1911年，發生了哪件事件導致清朝滅亡？', options: ['甲午戰爭', '戊戌政變', '八國聯軍侵華', '武昌起義'], correctAnswer: 3, explanation: '1911年爆發武昌起義（辛亥革命），各省紛紛響應獨立，最終迫使清帝退位。' },
    ];

    function HistoryGame() {
      const [gameState, setGameState] = useState('menu');
      const [selectedMode, setSelectedMode] = useState(null);
      const [currentQuestions, setCurrentQuestions] = useState([]);
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);

      const modes = useMemo(() => {
        const chapters = [...new Set(questionsData.map(q => `${q.unit} - ${q.chapter}`))];
        return [...chapters, '大混合 (全部章節)'];
      }, []);

      const startGame = (mode) => {
        let filteredQuestions = [];
        if (mode === '大混合 (全部章節)') {
          filteredQuestions = [...questionsData].sort(() => Math.random() - 0.5);
        } else {
          const [unit, chapter] = mode.split(' - ');
          filteredQuestions = questionsData.filter(q => q.unit === unit && q.chapter === chapter);
        }
        setSelectedMode(mode);
        setCurrentQuestions(filteredQuestions);
        setCurrentQuestionIndex(0);
        setScore(0);
        setSelectedAnswer(null);
        setShowExplanation(false);
        setGameState('playing');
      };

      const handleAnswer = (index) => {
        if (showExplanation) return;
        setSelectedAnswer(index);
        setShowExplanation(true);
        if (index === currentQuestions[currentQuestionIndex].correctAnswer) {
          setScore(score + 1);
        }
      };

      const nextQuestion = () => {
        if (currentQuestionIndex < currentQuestions.length - 1) {
          setCurrentQuestionIndex(currentQuestionIndex + 1);
          setSelectedAnswer(null);
          setShowExplanation(false);
        } else {
          setGameState('result');
        }
      };

      const backToMenu = () => setGameState('menu');

      if (gameState === 'menu') {
        return (
          <div className="min-h-screen bg-stone-100 flex flex-col items-center p-6 font-sans text-stone-800">
            <h1 className="text-4xl font-bold text-amber-800 mb-4 mt-10 text-center">中二中史溫習小遊戲</h1>
            <p className="text-xl mb-8 text-stone-600 text-center">請選擇你想溫習的單元，或挑戰大混合！</p>
            <div className="w-full max-w-md space-y-4 pb-10">
              {modes.map((mode, idx) => (
                <button
                  key={idx}
                  onClick={() => startGame(mode)}
                  className="w-full p-4 text-xl font-bold bg-amber-600 text-white rounded-xl shadow-md hover:bg-amber-700 active:bg-amber-800 transition-colors"
                >
                  {mode}
                </button>
              ))}
            </div>
          </div>
        );
      }

      if (gameState === 'result') {
        return (
          <div className="min-h-screen bg-stone-100 flex flex-col items-center justify-center p-6 font-sans text-stone-800">
            <div className="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md text-center">
              <h2 className="text-3xl font-bold text-amber-800 mb-4">溫習完成！</h2>
              <p className="text-2xl mb-6">你的得分：<span className="text-4xl font-bold text-amber-600">{score}</span> / {currentQuestions.length}</p>
              <button
                onClick={backToMenu}
                className="w-full flex items-center justify-center gap-2 p-4 text-xl font-bold bg-amber-600 text-white rounded-xl shadow-md hover:bg-amber-700 transition-colors"
              >
                <HomeIcon size={24} />
                返回主選單
              </button>
            </div>
          </div>
        );
      }

      const currentQ = currentQuestions[currentQuestionIndex];
      const isCorrect = selectedAnswer === currentQ.correctAnswer;

      return (
        <div className="min-h-screen bg-stone-100 flex flex-col items-center p-4 sm:p-6 font-sans text-stone-800">
          <div className="w-full max-w-lg">
            <div className="flex justify-between items-center mb-6">
              <button onClick={backToMenu} className="flex items-center gap-1 px-3 py-2 bg-stone-200 text-stone-700 rounded-lg hover:bg-stone-300 transition-colors font-bold">
                <ArrowLeftIcon size={20} /> 返回
              </button>
              <button onClick={backToMenu} className="flex items-center gap-1 px-3 py-2 bg-stone-200 text-stone-700 rounded-lg hover:bg-stone-300 transition-colors font-bold">
                <HomeIcon size={20} /> 主頁
              </button>
            </div>

            <div className="flex justify-between items-center mb-4 text-lg font-bold text-stone-600">
              <span>進度: {currentQuestionIndex + 1} / {currentQuestions.length}</span>
              <span className="text-amber-700">得分: {score}</span>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-md mb-6 border-t-4 border-amber-600">
              <span className="text-sm font-bold text-amber-600 mb-2 block">{currentQ.unit} - {currentQ.chapter}</span>
              <h2 className="text-2xl font-bold leading-snug whitespace-pre-line">{currentQ.question}</h2>
            </div>

            <div className="space-y-4 mb-6 pb-4">
              {currentQ.options.map((option, idx) => {
                let buttonClass = "w-full p-4 text-left text-xl rounded-xl shadow-sm transition-all border-2 ";
                if (!showExplanation) {
                  buttonClass += "bg-white border-stone-200 hover:border-amber-400 active:bg-stone-50";
                } else {
                  if (idx === currentQ.correctAnswer) {
                    buttonClass += "bg-green-100 border-green-500 text-green-800 font-bold";
                  } else if (idx === selectedAnswer) {
                    buttonClass += "bg-red-100 border-red-500 text-red-800";
                  } else {
                    buttonClass += "bg-stone-50 border-stone-200 opacity-50";
                  }
                }
                return (
                  <button key={idx} onClick={() => handleAnswer(idx)} disabled={showExplanation} className={buttonClass}>
                    <span className="mr-3 font-bold">{['A', 'B', 'C', 'D'][idx]}.</span>{option}
                  </button>
                );
              })}
            </div>

            {showExplanation && (
              <div className="pb-10">
                <div className={`p-5 rounded-xl mb-6 shadow-sm ${isCorrect ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
                  <h3 className={`text-2xl font-bold mb-3 ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                    {isCorrect ? '答對了！' : '答錯了！'}
                  </h3>
                  <div className="text-lg leading-relaxed text-stone-700">
                    {!isCorrect && (
                      <div className="mb-3 p-3 bg-white/60 rounded-lg border border-red-100">
                        <p className="text-red-800">你選擇了：「<span className="font-bold">{currentQ.options[selectedAnswer]}</span>」</p>
                        <p className="text-green-700 font-bold mt-1">正確答案是：「{currentQ.options[currentQ.correctAnswer]}」</p>
                      </div>
                    )}
                    <p><span className="font-bold">註釋：</span>{currentQ.explanation}</p>
                  </div>
                </div>
                <button onClick={nextQuestion} className="w-full p-4 text-2xl font-bold bg-amber-600 text-white rounded-xl shadow-md hover:bg-amber-700 transition-colors">
                  {currentQuestionIndex < currentQuestions.length - 1 ? '下一題' : '查看結果'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // 渲染遊戲到畫面上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HistoryGame />);
  </script>
</body>
</html>
